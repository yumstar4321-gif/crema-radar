# Builds and publishes the site:
#   • every morning at about 6:40am Sydney time (summer) / 5:40am (winter)
#   • whenever you push a change (e.g. a new pick or guide)
#   • when you press "Run workflow" on the Actions tab
#
# It publishes by pushing the built site to the `gh-pages` branch, which is
# what GitHub Pages serves. Don't edit `gh-pages` by hand: it is overwritten
# on every run.
#
# Live Amazon prices switch on automatically once you add the
# AMAZON_CLIENT_ID and AMAZON_CLIENT_SECRET secrets (needs Creators API access).
# Until then the site publishes without prices, which is allowed.

name: Daily deal check and publish

on:
  schedule:
    - cron: "40 19 * * *"   # 19:40 UTC = 6:40am AEDT / 5:40am AEST
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check Amazon prices (skipped until API keys are added)
        env:
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          AMAZON_TRACKING_ID: ${{ secrets.AMAZON_TRACKING_ID }}
        run: python scripts/fetch_deals.py

      - name: Build site and run safety checks (stops publishing if anything fails)
        run: python scripts/check.py

      - name: Publish to the gh-pages branch
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" \
            gh-pages
