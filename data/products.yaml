# ─────────────────────────────────────────────────────────────
#  Watchlist: the products the site lists and the daily check watches.
#
#  For each product:
#    id         short unique name used in page addresses (lowercase, dashes)
#    asin       Amazon AU product code (10 characters). Blank = the button
#               links to an Amazon AU search instead.
#    search     what to search on Amazon AU while asin is blank
#    category   machines | grinders | pods | accessories
#    blurb      one or two sentences in your own words
#    last_deal  optional, e.g. "October 2026": when it last had a big
#               discount on Amazon AU. Shown as "Last big drop" on the site.
#               Words only, never the price.
#    image      optional filename in static/products/ for a photo YOU own
#               or have the brand's permission to use. Never download
#               images from Amazon (against Amazon's rules). Once the API
#               is on, Amazon's own image appears automatically.
#
#  ASINs marked "(OzBargain)" were taken from Amazon AU deal posts on
#  OzBargain on the date shown. Open each one on amazon.com.au once to
#  confirm it's the listing you want (colour, AU stock) before relying on it.
# ─────────────────────────────────────────────────────────────

